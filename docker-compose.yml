version: '3.8'

services:
  # ──────────────────────────────────────────────
  # Backend API — FastAPI + Uvicorn
  # ──────────────────────────────────────────────
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: leaklens-backend
    ports:
      - "8000:8000"
    env_file:
      - ./backend/.env
    environment:
      - DATABASE_URL=postgresql+asyncpg://leaklens:${DB_PASSWORD:-leaklens_dev}@db:5432/leaklens
    volumes:
      - ./backend:/app
    depends_on:
      db:
        condition: service_healthy
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s
    networks:
      - leaklens-network

  # ──────────────────────────────────────────────
  # Frontend — React SPA served by Nginx
  # ──────────────────────────────────────────────
  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: leaklens-frontend
    ports:
      - "3000:80"
    depends_on:
      - backend
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:80"]
      interval: 30s
      timeout: 10s
      retries: 3
    networks:
      - leaklens-network

  # ──────────────────────────────────────────────
  # Database — PostgreSQL 16
  # ──────────────────────────────────────────────
  db:
    image: postgres:16-alpine
    container_name: leaklens-db
    environment:
      POSTGRES_DB: leaklens
      POSTGRES_USER: leaklens
      POSTGRES_PASSWORD: ${DB_PASSWORD:-leaklens_dev}
      PGDATA: /var/lib/postgresql/data/pgdata
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    restart: unless-stopped
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U leaklens -d leaklens"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 30s
    networks:
      - leaklens-network

volumes:
  pgdata:
    driver: local

networks:
  leaklens-network:
    driver: bridge
